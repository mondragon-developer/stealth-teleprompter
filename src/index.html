<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Script</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="app" class="panel">
      <header id="titlebar" data-tauri-drag-region>
        <div class="title-left" data-tauri-drag-region>
          <span id="script-title" data-tauri-drag-region>No script loaded</span>
          <span id="stealth-state">hidden from capture</span>
        </div>
        <div class="title-buttons">
          <button id="btn-update" class="primary hidden">Update</button>
          <button id="btn-scripts">Scripts</button>
          <button id="btn-help">Keys</button>
          <button id="btn-close" title="Close">x</button>
        </div>
      </header>

      <main id="stage">
        <div id="viewport">
          <div id="script-text"></div>
        </div>
        <textarea id="editor" class="hidden" spellcheck="false" placeholder="Edit your script here. Ctrl+Enter saves, Esc cancels."></textarea>
        <div class="focus-line"></div>
        <div id="countdown" class="hidden"></div>
        <div id="ghost-banner" class="hidden">Click-through is on. Press <span id="ghost-hotkey">Ctrl+Alt+G</span> to get your mouse back.</div>
      </main>

      <footer id="controls">
        <button id="btn-play" class="primary">Play</button>
        <button id="btn-restart" title="Back to top">Top</button>
        <div class="control">
          <span class="label">Speed</span>
          <input id="speed" type="range" min="10" max="300" step="5" />
          <span id="speed-val" class="value"></span>
        </div>
        <div class="control">
          <span class="label">Text</span>
          <button id="font-minus">-</button>
          <button id="font-plus">+</button>
        </div>
        <div class="control">
          <span class="label">Opacity</span>
          <input id="opacity" type="range" min="15" max="100" step="5" />
        </div>
        <div class="control" title="Estimated reading time left at the current speed">
          <span class="label">Left</span>
          <span id="time-left" class="value time"></span>
        </div>
        <button id="btn-edit" title="Edit this script in place" disabled>Edit</button>
        <button id="btn-edit-cancel" class="hidden">Cancel</button>
        <button id="btn-count" title="Count 3-2-1 before auto-scroll starts">3-2-1</button>
        <button id="btn-ghost" title="Let clicks pass through this window.">Ghost</button>
        <button id="btn-stealth" class="active" title="Hide this window from screen capture">Stealth</button>
        <button id="btn-theme" title="Switch color theme">Light</button>
      </footer>

      <aside id="sidebar" class="hidden">
        <div class="sidebar-head">
          <span>Scripts</span>
          <div class="sidebar-actions">
            <button id="btn-new">Paste new</button>
            <button id="btn-folder">Open folder</button>
            <button id="btn-refresh">Refresh</button>
          </div>
        </div>
        <ul id="script-list"></ul>
      </aside>

      <div id="help-pop" class="hidden">
        <div id="hotkey-list"></div>
        <p id="hk-hint">These work even while another app has the keyboard focus. Click a combo, then press new keys to change it. Esc cancels.</p>
        <p id="hk-error" class="hidden"></p>
        <button id="hk-reset">Reset defaults</button>
      </div>

      <div id="paste-modal" class="hidden">
        <div class="modal-card">
          <h3>New script</h3>
          <input id="paste-name" type="text" placeholder="Script name" />
          <textarea id="paste-content" placeholder="Paste your script here"></textarea>
          <div class="modal-actions">
            <button id="paste-cancel">Cancel</button>
            <button id="paste-save" class="primary">Save</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
